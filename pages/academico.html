<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acadêmico · Plataforma de Cursos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="app-shell">

    <!-- sidebar -->
    <aside class="sidebar">
        <div class="sidebar-brand">
            <i data-lucide="zap"></i>
            <span class="sidebar-brand-text">Plataforma</span>
        </div>
        <nav class="sidebar-nav">
            <a href="../index.html" class="sidebar-link">
                <i data-lucide="layout-dashboard"></i>
                <span class="sidebar-link-label">Dashboard</span>
            </a>
            <a href="usuario.html" class="sidebar-link">
                <i data-lucide="users"></i>
                <span class="sidebar-link-label">Usuários</span>
            </a>
            <a href="academico.html" class="sidebar-link active">
                <i data-lucide="graduation-cap"></i>
                <span class="sidebar-link-label">Acadêmico</span>
            </a>
            <a href="conteudo.html" class="sidebar-link">
                <i data-lucide="layers"></i>
                <span class="sidebar-link-label">Conteúdo</span>
            </a>
            <a href="trilha.html" class="sidebar-link">
                <i data-lucide="route"></i>
                <span class="sidebar-link-label">Trilhas</span>
            </a>
            <a href="certificados.html" class="sidebar-link">
                <i data-lucide="award"></i>
                <span class="sidebar-link-label">Certificados</span>
            </a>
            <a href="financeiro.html" class="sidebar-link">
                <i data-lucide="credit-card"></i>
                <span class="sidebar-link-label">Financeiro</span>
            </a>
        </nav>
        <div class="sidebar-footer">
            <p class="sidebar-footer-text">LAB03 · v2.0</p>
        </div>
    </aside>

    <!-- conteudo -->
    <main class="main-content">

        <!-- Page Header -->
        <header class="page-header">
            <h1 class="page-title">Módulo Acadêmico</h1>
            <p class="page-subtitle">Gerencie categorias de ensino e cursos disponíveis.</p>
        </header>

        <!-- categorias -->
        <div class="table-card mb-4">
            <div class="p-3 border-bottom d-flex align-items-center justify-content-between">
                <div class="d-flex align-items-center gap-2">
                    <i data-lucide="tag" style="width:15px;height:15px;color:var(--text-2);stroke-width:1.75"></i>
                    <span class="fw-semibold text-sm">Categorias</span>
                </div>
                <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#modalCategoria">
                    <i class="bi bi-plus-lg me-1"></i>Nova Categoria
                </button>
            </div>
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light text-muted">
                        <tr>
                            <th class="ps-4">ID</th>
                            <th>Nome</th>
                            <th>Descrição</th>
                            <th class="text-center pe-4">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="corpoCategorias"></tbody>
                </table>
            </div>
        </div>

        <!-- cursos -->
        <div class="table-card">
            <div class="p-3 border-bottom d-flex align-items-center justify-content-between">
                <div class="d-flex align-items-center gap-2">
                    <i data-lucide="book-open" style="width:15px;height:15px;color:var(--text-2);stroke-width:1.75"></i>
                    <span class="fw-semibold text-sm">Cursos</span>
                </div>
                <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#modalCurso"
                        onclick="prepararModalCurso()">
                    <i class="bi bi-plus-circle-fill me-1"></i>Novo Curso
                </button>
            </div>
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light text-muted">
                        <tr>
                            <th class="ps-4">ID</th>
                            <th>Título</th>
                            <th>Categoria</th>
                            <th>Instrutor</th>
                            <th>Nível</th>
                            <th>Aulas</th>
                            <th>Horas</th>
                            <th>Publicação</th>
                            <th class="text-center pe-4">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="corpoCursos"></tbody>
                </table>
            </div>
        </div>

    </main>
</div><!-- /app-shell -->

<!-- modal nova categoria -->
<div class="modal fade" id="modalCategoria" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg">
            <div class="modal-header bg-dark text-white border-0">
                <h5 class="modal-title fw-bold">
                    <i class="bi bi-tag-fill me-2 text-info"></i>Nova Categoria
                </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body p-4">
                <div class="mb-3">
                    <label class="form-label small fw-bold text-muted">NOME DA CATEGORIA</label>
                    <input type="text" id="cat-nome" class="form-control" placeholder="Ex: Programação">
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-bold text-muted">DESCRIÇÃO</label>
                    <textarea id="cat-desc" class="form-control" rows="2" placeholder="Breve descrição..."></textarea>
                </div>
            </div>
            <div class="modal-footer border-0 p-4 pt-0">
                <button class="btn btn-primary w-100 fw-bold py-3" onclick="salvarCategoria()">
                    CADASTRAR CATEGORIA
                </button>
            </div>
        </div>
    </div>
</div>

<!-- modal novo curso -->
<div class="modal fade" id="modalCurso" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg">
            <div class="modal-header bg-dark text-white border-0">
                <h5 class="modal-title fw-bold">
                    <i class="bi bi-mortarboard me-2 text-success"></i>Novo Curso
                </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body p-4">
                <div class="row">
                    <div class="col-md-8 mb-3">
                        <label class="form-label small fw-bold text-muted">TÍTULO DO CURSO</label>
                        <input type="text" id="c-titulo" class="form-control" placeholder="Ex: JavaScript Avançado">
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label small fw-bold text-muted">NÍVEL</label>
                        <select id="c-nivel" class="form-select">
                            <option value="Iniciante">Iniciante</option>
                            <option value="Intermediário">Intermediário</option>
                            <option value="Avançado">Avançado</option>
                        </select>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-bold text-muted">DESCRIÇÃO</label>
                    <textarea id="c-desc" class="form-control" rows="2" placeholder="Do que se trata o curso..."></textarea>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label small fw-bold text-muted">INSTRUTOR</label>
                        <select id="c-instrutor" class="form-select"></select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label small fw-bold text-muted">CATEGORIA</label>
                        <select id="c-categoria" class="form-select"></select>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label small fw-bold text-muted">TOTAL DE AULAS</label>
                        <input type="number" id="c-aulas" class="form-control" min="0" value="0">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label small fw-bold text-muted">TOTAL DE HORAS</label>
                        <input type="number" id="c-horas" class="form-control" min="0" step="0.5" value="0">
                    </div>
                </div>
            </div>
            <div class="modal-footer border-0 p-4 pt-0">
                <button class="btn btn-primary w-100 fw-bold py-3" onclick="salvarCurso()">
                    CADASTRAR CURSO
                </button>
            </div>
        </div>
    </div>
</div>

<!-- scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/utils.js"></script>
<script src="../modules/usuario/usuario.js"></script>
<script src="../modules/usuario/usuarioController.js"></script>
<script src="../modules/categoria/categoria.js"></script>
<script src="../modules/categoria/categoriaController.js"></script>
<script src="../modules/curso/curso.js"></script>
<script src="../modules/curso/cursoController.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>

<script>
    const userCtrl  = new UsuarioController();
    const catCtrl   = new CategoriaController();
    const cursoCtrl = new CursoController();

    // renderizar tabela de categorias
    const renderCategorias = () => {
        const categorias = catCtrl.listarTodas();
        const corpo = document.getElementById('corpoCategorias');

        corpo.innerHTML = categorias.map(c => `
            <tr>
                <td class="ps-4 text-muted small">#${c.ID_Categoria}</td>
                <td class="fw-bold">${c.Nome}</td>
                <td class="text-muted small">${c.Descricao || '—'}</td>
                <td class="text-center pe-4">
                    <button class="btn btn-sm btn-outline-danger border-0" title="Excluir"
                            onclick="removerCategoria(${c.ID_Categoria})">
                        <i class="bi bi-trash3"></i>
                    </button>
                </td>
            </tr>
        `).join('') || '<tr><td colspan="4" class="text-center py-4 text-muted">Nenhuma categoria.</td></tr>';
    };

    // renderizar tabela de cursos
    const renderCursos = () => {
        const cursos = cursoCtrl.listarTodos();
        const corpo = document.getElementById('corpoCursos');

        corpo.innerHTML = cursos.map(c => {
            const instrutor = userCtrl.buscarPorId(c.ID_Instrutor);
            const categoria = catCtrl.buscarPorId(c.ID_Categoria);
            return `
                <tr>
                    <td class="ps-4 text-muted small">#${c.ID_Curso}</td>
                    <td class="fw-bold">${c.Titulo}</td>
                    <td><span class="badge bg-light text-primary border">${categoria ? categoria.Nome : '?'}</span></td>
                    <td class="small">${instrutor ? instrutor.NomeCompleto : 'N/A'}</td>
                    <td><span class="badge bg-primary">${c.Nivel}</span></td>
                    <td class="text-center">${c.TotalAulas}</td>
                    <td class="text-center">${c.TotalHoras}h</td>
                    <td class="text-muted small">${c.DataPublicacao}</td>
                    <td class="text-center pe-4">
                        <button class="btn btn-sm btn-outline-danger border-0" title="Excluir"
                                onclick="removerCurso(${c.ID_Curso})">
                            <i class="bi bi-trash3"></i>
                        </button>
                    </td>
                </tr>
            `;
        }).join('') || '<tr><td colspan="9" class="text-center py-4 text-muted">Nenhum curso cadastrado.</td></tr>';
    };

    // preparar selects do modal de curso
    const prepararModalCurso = () => {
        const instrutores = userCtrl.listarInstrutores();
        document.getElementById('c-instrutor').innerHTML = instrutores.length > 0
            ? instrutores.map(u => `<option value="${u.ID_Usuario}">${u.NomeCompleto}</option>`).join('')
            : '<option value="">Nenhum instrutor cadastrado</option>';

        const categorias = catCtrl.listarTodas();
        document.getElementById('c-categoria').innerHTML = categorias.length > 0
            ? categorias.map(c => `<option value="${c.ID_Categoria}">${c.Nome}</option>`).join('')
            : '<option value="">Nenhuma categoria cadastrada</option>';
    };

    // salvar categoria
    const salvarCategoria = () => {
        const nome = document.getElementById('cat-nome').value;
        const desc = document.getElementById('cat-desc').value;
        try {
            catCtrl.cadastrar(nome, desc);
            document.getElementById('cat-nome').value = '';
            document.getElementById('cat-desc').value = '';
            bootstrap.Modal.getInstance(document.getElementById('modalCategoria')).hide();
            renderCategorias();
        } catch (erro) {
            mostrarToast(erro.message);
        }
    };

    // salvar curso
    const salvarCurso = () => {
        const titulo    = document.getElementById('c-titulo').value;
        const descricao = document.getElementById('c-desc').value;
        const instrutor = document.getElementById('c-instrutor').value;
        const categoria = document.getElementById('c-categoria').value;
        const nivel     = document.getElementById('c-nivel').value;
        const aulas     = document.getElementById('c-aulas').value;
        const horas     = document.getElementById('c-horas').value;
        try {
            cursoCtrl.cadastrar(titulo, descricao, instrutor, categoria, nivel, aulas, horas);
            document.getElementById('c-titulo').value = '';
            document.getElementById('c-desc').value   = '';
            document.getElementById('c-aulas').value  = '0';
            document.getElementById('c-horas').value  = '0';
            bootstrap.Modal.getInstance(document.getElementById('modalCurso')).hide();
            renderCursos();
        } catch (erro) {
            mostrarToast(erro.message);
        }
    };

    // remover
    const removerCategoria = (id) => {
        confirmar('Excluir esta categoria? Cursos vinculados ficarão sem categoria.', () => {
            catCtrl.remover(id);
            renderCategorias();
        });
    };

    const removerCurso = (id) => {
        confirmar('Tem certeza que deseja excluir este curso?', () => {
            cursoCtrl.remover(id);
            renderCursos();
        });
    };

    // init
    window.onload = () => {
        lucide.createIcons();
        renderCategorias();
        renderCursos();
    };
</script>

</body>
</html>
